name: Validar ATLAS en Windows

# Validación manual de una rama o al publicar expresamente una etiqueta rc.
# Comprobar la cuota/bloqueo de gasto antes de cada ejecución.
# No necesita secretos ni llama a proveedores de IA o datos de mercado.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-rc.*'

permissions:
  contents: read

concurrency:
  group: atlas-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      ATLAS_DATA_DIR: var/test-data
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/var/playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.4'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Instalar pnpm fijado
        run: npm.cmd install --global pnpm@11.19.0
      - name: Instalar dependencias de frontend fijadas
        working-directory: frontend
        run: pnpm.cmd install --frozen-lockfile --prod=false
      - name: Pruebas de comportamiento del frontend
        working-directory: frontend
        run: pnpm.cmd run test:run
      - name: Transporte HTTP local y cancelaciones
        run: node --test frontend/api-proxy.test.mjs
      - name: Regresión de conexiones HTTP de Node en Windows
        run: node tools/diagnostics/http_connection_probe.mjs 30000
      - name: Instalar dependencias y compilar
        run: ./Install-Atlas.ps1
      - name: Pruebas Python con datos aislados
        run: ./.venv/Scripts/python.exe -m pytest -q --basetemp var/pytest-ci
      - name: TypeScript
        run: node frontend/node_modules/typescript/bin/tsc --noEmit --project frontend/tsconfig.json
      - name: Contratos generados coherentes con el motor
        run: ./.venv/Scripts/python.exe tools/export_contracts.py --check
      - name: Lint de la aplicación mantenida
        working-directory: frontend
        run: node node_modules/oxlint/bin/oxlint app lib components/atlas features shared test e2e next.config.ts local-server.mjs api-proxy.mjs api-proxy.test.mjs vitest.config.ts playwright.config.ts
      - name: Instalar Chromium fijado para los recorridos E2E
        run: node frontend/node_modules/@playwright/test/cli.js install chromium
      - name: Recorridos de navegador con interfaz compilada y base aislada
        id: e2e
        run: ./.venv/Scripts/python.exe tools/diagnostics/run_api_diagnostic.py
      - name: Conservar evidencia del fallo E2E aislado
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-windows-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: warn
          # Only synthetic E2E evidence; never databases, .env or ordinary var/.
          path: |
            var/validation/e2e-*/browser-artifacts/**
            var/validation/e2e-*/playwright.json
            var/validation/e2e-*/playwright.xml
            var/validation/e2e-*/playwright.log
            var/validation/e2e-*/backend.log
            var/validation/e2e-*/frontend.log
            var/validation/e2e-*/diagnostic-report.json
            var/validation/e2e-*/tcp-pressure.jsonl
      - name: Arranque y recorrido sintético mediante el proxy
        id: runtime
        run: |
          ./Start-Atlas.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe tools/smoke_local.py
      - name: Parada
        if: ${{ always() && (steps.runtime.outcome == 'success' || steps.runtime.outcome == 'failure' || steps.runtime.outcome == 'cancelled') }}
        run: ./Stop-Atlas.ps1
